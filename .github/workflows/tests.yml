name: tests
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      SMS_BACKEND: database
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: docker compose exec -T web php bin/console.php migrate
      - run: docker compose exec -T db mariadb -uroot -plocal-root-development-only -e "CREATE DATABASE albataxi_test; GRANT ALL ON albataxi_test.* TO 'alba'@'%';"
      - run: docker compose exec -T -e DB_DSN='mysql:host=db;dbname=albataxi_test;charset=utf8mb4' web php tests/run.php
      - run: docker compose exec -T web php tests/smslink.php
      - run: docker compose exec -T web composer audit
      - run: docker compose exec -T -e ALBA_DEMO_PASSWORD=Local-CI-test-password web php bin/seed-demo.php
      - run: docker compose exec -T -e ALBA_DEMO_PASSWORD=Local-CI-test-password web php tests/http.php http://web/
      - run: docker compose run -d --no-deps -e SMS_BACKEND=disabled --name albataxi-no-sms-test web
      - run: |
          docker exec albataxi-no-sms-test php -r 'for($i=0;$i<30;$i++){if(@file_get_contents("http://localhost/?page=health")!==false){exit(0);}sleep(1);}exit(1);'
      - run: docker compose exec -T -e SMS_BACKEND=disabled web php tests/http-sms-optional.php http://albataxi-no-sms-test/
      - run: docker compose exec -T web php bin/package.php


  laptop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/laptop-crypto.ps1
      - run: pwsh -NoProfile -File bin/package-laptop.ps1
